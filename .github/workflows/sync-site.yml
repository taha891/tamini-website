{"name": "Synchroniser le site", "on": {"workflow_dispatch": {}, "schedule": [{"cron": "*/30 * * * *"}]}, "permissions": {"contents": "write"}, "concurrency": {"group": "sync-site", "cancel-in-progress": false}, "jobs": {"sync": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Recuperer la derniere version et publier", "run": "set -e\ngit clone --depth 1 --branch tamini-website-v2 https://github.com/swiftcab/tamini-chatbot /tmp/src\nrsync -a --delete --exclude .git --exclude .github /tmp/src/ ./\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add -A\nif git diff --cached --quiet; then echo 'Rien a publier'; exit 0; fi\ngit commit -m 'Mise a jour du site (synchronisation automatique)'\ngit push"}]}}}
